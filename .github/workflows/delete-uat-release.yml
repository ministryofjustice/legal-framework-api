name: Delete UAT release

on:
  pull_request:
    types:
      - closed
  workflow_call:
    secrets:
      KUBE_UAT_CLUSTER:
        required: true
      KUBE_UAT_CERT:
        required: true
      KUBE_UAT_NAMESPACE:
        required: true
      KUBE_UAT_TOKEN:
        required: true

permissions: {}

jobs:
  delete_uat_job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #--v7.0.1

      - name: Delete UAT release action
        id: delete_uat
        uses: ministryofjustice/laa-civil-apply-delete-uat-release@23e404138cfb4442ec62d8a13dfccc5355231b17 # v1.1.0
        with:
          k8s_cluster: ${{ secrets.KUBE_UAT_CLUSTER }}
          k8s_cluster_cert: ${{ secrets.KUBE_UAT_CERT }}
          k8s_namespace: ${{ secrets.KUBE_UAT_NAMESPACE }}
          k8s_token: ${{ secrets.KUBE_UAT_TOKEN }}
          delete_all_pvc: true

      - name: Delete UAT RDS database
        shell: bash
        id: delete_uat_db
        run: |
          bin/uat_drop_db ${{ steps.delete_uat.outputs.release-name }}

      - name: Result
        shell: bash
        run: echo ${{ steps.delete_uat.outputs.delete-message }}
