---
# Mapping of matter type to the expert types that are valid for it.
# Matter type codes that do not appear here will return no expert types.
# - matter_type_code (string) matter-type-unique-code
# - expert_type_codes (string[]) expert-type-unique-codes

- matter_type_code: KPBLW
  expert_type_codes:
    - psychologist
    - child_psychologist
    - psychiatrist
    - interpreter
    - independent_social_worker
    - paediatrician
    - radiologist
    - neuroradiologist
    - haematologist
    - ophthalmologist
    - neurosurgeon
    - geneticist
    - risk_assessor
    - toxicologist
    - neurologist
